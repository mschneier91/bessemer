# test/baselines.yaml -- the single source of truth for all stored numerical
# baselines (CLAUDE.md 1.0b). Test sources MUST read expected values from here;
# never hardcode a baseline as a magic number in test code.
#
# Populated per sub-sprint as checks come online. Sprint 1.0b introduces no
# numerics, so every section below is an empty placeholder documenting the schema.
#
# Conventions:
#   * Iteration-count baselines are recorded per preconditioner (jacobi vs amg),
#     per grad-div setting (gd0 vs gdpos), and -- because AMG counts are legitimately
#     rank-count-sensitive -- per rank count. Jacobi counts should agree across
#     np to within +/-1, so a single value with a tolerance band suffices there.
#   * Solver-health baselines are per-dt (the Sprint-1 pressure-mass Schur block
#     degrades as dt shrinks; that is expected, not a regression).

schema_version: 1

# FGMRES outer-iteration counts.
# schur_quality_2d_periodic: fully periodic [0,2pi]^2, Q3/Q2, one implicit solve
# at fixed dt with momentum block mass_coeff*M + nu*K (mass_coeff = beta0/dt for
# BDF2 at dt = 0.01). Jacobi velocity block; counts agree across np in {1,2,4}
# within `band`. `flat_band` bounds max-min across the meshes (mesh robustness).
# Grad-div (gdpos) and AMG baselines land in 1.10 / when AMG is wired.
solver_iterations:
  schur_quality_2d_periodic:
    nu: 1.0
    mass_coeff: 150.0   # beta0/dt = 1.5/0.01
    rtol: 1.0e-8
    band: 3
    flat_band: 5
    jacobi:
      # Seeded 2026-07-10 (desktop, MFEM dev 4.9.1): identical at np {1,2,4}.
      n4: 9
      n8: 8
      n16: 7
    # gamma = grad_div_scale * h per element on the velocity block; the Schur
    # block is UNCHANGED (nu * M_p^{-1} -- gamma never enters it, user decision).
    grad_div_scale: 1.0
    jacobi_gdpos:
      # Seeded 2026-07-11 (desktop, MFEM dev 4.9.1): identical at np {1,2,4}.
      # Barely above the gamma=0 counts and mesh-flat -- empirical confirmation
      # that leaving gamma out of the Schur block costs nothing.
      n4: 10
      n8: 10
      n16: 10

  # LOR-BoomerAMG velocity block (H5), VISCOUS-DOMINATED steady Stokes on the
  # unit box (homogeneous velocity Dirichlet, mass_coeff = 0, Q3/Q2). This is
  # the regime AMG is for: BoomerAMG runs on a low-order-refined (Q1-on-GLL-
  # nodes) rediscretization that is spectrally equivalent to the high-order
  # momentum block, so the iteration count is ~mesh-INDEPENDENT while Jacobi
  # grows ~quadratically (63 -> 160 -> 594 at n = 4,8,16). AMG counts are
  # rank-sensitive -> per-np. Seeded 2026-07-15 (desktop, MFEM dev).
  lor_amg_viscous_dirichlet:
    rtol: 1.0e-8
    band: 4                 # per-entry tolerance on the LOR-AMG count
    mesh_robust_band: 25    # max-min across n must stay under this (LOR: ~16)
    jacobi_finest_ratio: 3  # jacobi[n16] must exceed this * lor_amg[n16]
    np1: { n4: 53, n8: 62, n16: 69 }
    np2: { n4: 56, n8: 62, n16: 69 }
    np4: { n4: 57, n8: 63, n16: 69 }
    # Real-GPU (CUDA/HIP) counts. hypre picks the BoomerAMG smoother at RUNTIME
    # -- mfem linalg/hypre.hpp:1161 returns HypreUsingGPU() ? l1Jacobi : l1GS.
    # l1-Gauss-Seidel is sequential and cannot run on a device, so under
    # INCNS_DEVICE=cuda the smoother drops to the weaker l1-Jacobi and the
    # viscous LOR-AMG count sits a small CONSTANT above the desktop (l1-GS)
    # baseline above. Spectral equivalence is intact -- the mesh-robust spread
    # stays ~14 (max-min), same order as on CPU; only the additive constant
    # moves, so a per-device baseline is correct where widening `band` would
    # blind the guard on both platforms. Selected in-code via
    # Device::Allows(CUDA_MASK|HIP_MASK), mirroring incns_test::ReproTol; the
    # host block stays strict. These counts are NOT run-to-run reproducible here
    # (same PMIS/atomics non-determinism repro_tolerance.hpp documents): separate
    # runs on H100 w001 (2026-07-22) gave np1 {61/69/77} & {62/68/76} and np2
    # {60/69/76} & {62/71/76} -- drift ~+/-2 (three back-to-back runs agreed, but
    # a later run did not). Values below are CENTERED over that observed range so
    # band 4 keeps >=3 counts of headroom; seeding from one run would be flaky.
    # np4 seeded 2026-07-22 from an np4 run on a 2-GPU allocation (4 ranks / 2
    # cards): LOR-AMG counts are np-dependent, NOT GPU-placement-dependent, so
    # these equal the 4-GPU one-rank-per-card config; 3 runs, spread 0, no OOM.
    cuda:
      np1: { n4: 61, n8: 69, n16: 77 }
      np2: { n4: 61, n8: 70, n16: 76 }
      np4: { n4: 60, n8: 70, n16: 77 }

  # Cahouet-Chabard robustness caps (CC.8 / SPEC T3+T5). Property caps, not
  # exact per-np counts: the inner CG + AMG make CC counts mildly np-sensitive,
  # so we pin the PROPERTIES (bounded, flat, mass-degrades, legacy-degrades).
  # Placeholder zeros -- seeded from measurement below.
  # Seeded 2026-07-17 (desktop). Measured: sigma sweep {0,10,1e3,1e5} cc
  # 19-32 flat, mass (same LOR-AMG velocity block) 45-104 with the degradation
  # at sigma=1e5 (104 vs 32 -- the Delta-t limitation CC removes); nu sweep
  # {1..1e-6} cc 20-34; T5 (outflow domain, rtol 1e-10) consistent 54/52/49 vs
  # legacy 57/57/55 at n=8/16/32 -- gap grows under refinement. Counts np-stable
  # to +-2 at np {1,2,4}.
  cc_robustness:
    sigma_sweep_cc_cap: 45
    sigma_mass_degradation_ratio: 2.0
    nu_sweep_cc_cap: 45
    t5_consistent_cap: 65
    t5_legacy_min_ratio: 1.04
    # Cap for the full slow-tier (nu, sigma, h, p) grid. Measured 2026-07-17:
    # worst 63 (2D grid: nu {1..1e-6} x sigma {0..1e6} x n {4,8,16} x Q2..Q5)
    # and 59 (3D subset) -- bounded over the whole grid, ~17 s wall at np=4.
    slow_sweep_cc_cap: 85

# Convergence-oracle rates (filled in 1.5/1.8). Targets derive from the configured
# (k_u, k_p) pair; defaults are Q3/Q2 => velocity order 4, pressure order 3.
#   tgv2d:
#     spatial:  { velocity_order: <rate>, pressure_order: <rate>, slack: 0.2 }
#     temporal: { bdf2: 2.0, bdf3: 3.0, slack: 0.2 }
convergence_rates: {}

# Divergence norms (filled in 1.10). ||div u|| ceilings, gamma=0 vs gamma>0.
divergence: {}

# DFG benchmark 2D-1 (steady flow around a cylinder, Re = 20) --
# test/dfg_cylinder_slow_test (slow tier, np 4). `reference`: John's values
# (literature, not measured here). Per run: the configuration and the
# relative-error ceilings, ~2x the errors measured 2026-10-06 (desktop, np 4) on
# the default cylinder-channel mesh (208 Q3/Q2 elements), marched to t_final:
#   convective:          c_D 1.047e-4, c_L 2.789e-3, dp 4.058e-3 (2922 steps, 9 min)
#   rotational_grad_div: c_D 1.025e-4, c_L 1.133e-2, dp 5.735e-3 (428 steps, 1.7 min)
# For comparison (not tested): rotational WITHOUT grad-div c_D 9.45e-4,
# c_L 5.32e-2, and refining the cylinder region 4x leaves c_D at 7.2e-4 --
# the rotation form's known accuracy loss, which grad-div removes.
dfg_2d1:
  reference:
    c_d: 5.57953523384
    c_l: 0.010618948146
    dp: 0.11752016697
  convective:
    rotational: false
    grad_div: 0.0
    cfl_max: 0.24   # Nek-scale CFL (2026-10-07); = 0.6 in the old k^2 measure
    t_final: 8.0
    max_rel_err_c_d: 2.0e-4
    max_rel_err_c_l: 6.0e-3
    max_rel_err_dp: 8.0e-3
  rotational_grad_div:
    rotational: true
    grad_div: 1.0
    cfl_max: 0.0
    t_final: 8.0
    max_rel_err_c_d: 2.0e-4
    max_rel_err_c_l: 2.5e-2
    max_rel_err_dp: 1.2e-2

# Verification tier (label `verify`, np 4; test/verify_*_test.cpp, human
# 2026-10-15). Studies run through Case on minimal decks, so they verify
# whatever the case-level defaults are; each spatial study also runs with
# grad-div switched off. Pass: the convergence rate fitted (least squares)
# over all levels >= theory - rate_margin (human 2026-10-15: margin 0.3), and
# the finest error above noise_floor. The levels and march settings live here
# so a study can be re-levelled without a code change; the margin is the
# baseline -- never widen it to make a study pass.
verification:
  rate_margin: 0.3
  noise_floor: 1.0e-12
  # Steady Stokes by pseudo-time marching from the interpolated exact
  # solution: nu dt = 1 damps every mode by >= ~6x per BDF2 step.
  steady_stokes:
    nu: 1.0
    dt: 1.0
    t_final: 6.0
    rtol: 1.0e-12
    atol: 1.0e-14   # floor: near the steady state each step's residual is tiny
  stokes_2d:        # unit square, n x n elements per level
    orders: [2, 3, 4]
    levels: [4, 8, 16]
  stokes_3d:        # unit cube, n^3 elements per level
    orders: [2, 3]
    levels: [2, 4, 8]
  curved_2d:        # default orders; interior nodes moved by amplitude sin sin
    amplitude: 0.1
    levels: [4, 8, 16]
  nonconforming_2d: # default orders; the box plus the AMR tests' refined bands
    levels: [2, 4, 8]
  # Kovasznay flow, default orders and time scheme; level n = 3n x 4n elements
  # on [1.5 x 2]. March until the velocity error changes by < steady_tol over
  # check_every time units twice in a row (fails if not by t_max). Levels
  # [1, 2, 4] since the Q6 default (human 2026-10-16): at Q6 [2, 4, 8] put the
  # finest level on the ~1e-10 round-off floor (u_l2 4.8e-9 -> 1.7e-10, p_l2
  # 1.4e-10 -> 3.5e-10 from level 4 to 8, after rates 7.0 / 7.4 from 2 to 4).
  kovasznay:
    re: 40.0
    levels: [1, 2, 4]
    dt: 0.01        # first step; the default CFL control takes over
    t_max: 40.0
    check_every: 1.0
    steady_tol: 1.0e-3
    rtol: 1.0e-12
    atol: 1.0e-14
  # 3D temporal order: elements^3 Q-default mesh, fixed steps, errors against
  # the same scheme at dt_ref.
  temporal_3d:
    nu: 0.1
    elements: 2
    t_final: 0.2
    dts: [0.01, 0.005, 0.0025]
    dt_ref: 0.000625
    rtol: 1.0e-12
    atol: 1.0e-15
  # Linear elasticity (verify_elasticity_test). Material for the manufactured
  # solutions and the Lame cylinder; each study runs at `orders` and at the
  # deck default order over `default_levels`.
  elasticity:
    youngs_modulus: 1.0
    poisson_ratio: 0.3
    rtol: 1.0e-12
    mms_2d:           # unit square, n x n elements per level
      orders: [2, 3, 4]
      levels: [4, 8, 16]
      default_levels: [2, 3, 4]
    mms_3d:           # unit cube, n^3 elements per level
      orders: [2, 3]
      levels: [2, 4, 8]
      default_levels: [2, 3, 4]
    lame_cylinder:    # quarter annulus, n x n curved elements per level
      inner_radius: 1.0
      outer_radius: 2.0
      pressure: 0.1
      orders: [2, 3]
      levels: [2, 4, 8]
      default_levels: [4, 6, 8]  # Q6 is pre-asymptotic below 4 x 4
    # Cook (1974): E = 1, nu = 1/3, total shear load 1 on the right edge;
    # the vertical displacement at the midpoint (48, 52) of the loaded edge.
    # Literature values: 23.96 in plane stress (e.g. Pian & Sumihara 1984;
    # Simo & Rifai 1990), 21.520 in plane strain (Auricchio, Beirao da Veiga,
    # Lovadina & Reali, CMAME 194 (2005)). The finest default-order level must
    # be within `tolerance` (relative) of each.
    cook_membrane:
      levels: [4, 8, 16]
      point: [48.0, 52.0]
      reference_uy_plane_stress: 23.96
      reference_uy_plane_strain: 21.520
      tolerance: 0.002
    # Elastodynamics at the deck's default time scheme and order: the
    # separable motion u = s(x) T(t) (s in the space, so every error is the
    # integrator's) on a 2 x 2 mesh to t = 1 in each of `steps`; the fitted
    # rate must reach the scheme's order - rate_margin.
    dynamic_mms:
      steps: [20, 40, 80]
    # A clamped-free beam, L / D = 20, plane stress, started from the
    # Euler-Bernoulli first mode shape: the period from the tip's zero
    # crossings over `periods` periods against the Euler-Bernoulli frequency
    # (1.8751 / L)^2 sqrt(E I / (rho A)). Shear and rotary inertia lower the
    # continuum's: Timoshenko's first-order estimate, -(beta L)^2 (r / L)^2
    # (1 + E / (kappa G)) / 2 with r^2 = D^2 / 12 and kappa = 5/6, is -0.15 %
    # here; measured -0.151 % (Q6, generalized-alpha rho_inf 0.8, 2026-10-19).
    cantilever_frequency:
      length: 20.0
      depth: 1.0
      elements: [40, 2]
      youngs_modulus: 1000.0
      poisson_ratio: 0.3
      density: 1.0
      steps_per_period: 200
      periods: 3
      tolerance: 0.005
  # Large-deformation elasticity (verify_hyperelasticity_test), St.
  # Venant-Kirchhoff, static. V1: the manufactured finite deformation u_i =
  # a prod_d sin(pi x_d) (gradient up to a pi), held on the whole boundary,
  # under -Div P; each study runs at `orders` and at the deck default order over
  # `default_levels`. a = 0.05: J >= 0.84 and the acoustic tensor's least
  # eigenvalue 0.18 (2D, mu 0.385). At a = 0.1 (J 0.69) it is -0.025: SVK
  # loses strong ellipticity and Newton diverges on fine meshes (2026-10-22).
  hyperelasticity:
    youngs_modulus: 1.0
    poisson_ratio: 0.3
    rtol: 1.0e-12        # CG, each Newton correction
    newton_rtol: 1.0e-10
    mms_amplitude: 0.05
    mms_2d:              # unit square, n x n elements per level
      orders: [2, 3, 4]
      levels: [4, 8, 16]
      default_levels: [2, 3, 4]
    mms_3d:              # unit cube, n^3 elements per level
      orders: [2, 3]
      levels: [2, 4, 8]
      default_levels: [2, 3, 4]
    # V2: Turek & Hron (2006) CSM1 and CSM2 through a deck: the flag (0.35 x
    # 0.02) clamped to the cylinder, rho_s g = 1000 x 2 per reference volume,
    # nu_s = 0.4, plane strain; point A = (0.6, 0.2). Reference u(A): the
    # benchmark's own table (FeatFlow, "CSM tests", level 4+2, 164092 Q2 dofs;
    # read 2026-10-22), whose finest levels spread by ~1e-4 relative (CSM1 u_y
    # -66.0965 at 4+0 to -66.1029 at 4+3, e-3). This solver converges (Q6 on
    # 16 x 2 to 64 x 8 flag meshes) to within 1.1e-4 (u_y) and 1.8e-4 (u_x) of
    # it. Levels are [n_flag, n_flag_y]; the finest must be within `tolerance`
    # (relative) of each component.
    turek_hron_csm:
      poisson_ratio: 0.4
      body_force: [0.0, -2000.0]
      order: 6
      levels: [[16, 2], [32, 4]]
      tolerance: 5.0e-4
      csm1:
        youngs_modulus: 1.4e6  # mu_s = 0.5e6
        reference_u_a: [-7.18766e-3, -66.1023e-3]
      csm2:
        youngs_modulus: 5.6e6  # mu_s = 2.0e6
        reference_u_a: [-0.468999e-3, -16.9739e-3]
      # CSM3: CSM1's flag released from rest, rho_s = 1000, to t = 10. The
      # benchmark's u(A) as mean +- amplitude [frequency] at its dt 0.005
      # (level 4+0): its values move with dt by up to 2.4 % (u_x mean
      # -14.384, -14.645, -14.305 e-3 at dt 0.02, 0.01, 0.005), as ours do
      # (u_y mean 0.8 % from dt 0.005 to 0.0025: the extremes of a signal
      # with the higher bending modes in it). Ours at Q4 16 x 2 (space
      # converged to 2e-4): u_x -14.548 +- 14.548, u_y -63.942 +- 65.500,
      # 1.0942-1.0954 (job 49596583). Mean and amplitude from the extremes
      # over t >= window_start; the frequency from the upward crossings.
      csm3:
        youngs_modulus: 1.4e6
        density: 1000.0
        rho_inf: 1.0
        order: 4
        level: [16, 2]
        dt: 0.005
        t_final: 10.0
        window_start: 5.0
        reference_u_x: [-14.305e-3, 14.305e-3]
        reference_u_y: [-63.607e-3, 65.160e-3]
        reference_frequency: 1.0995
        tolerance: 0.025
        tolerance_frequency: 0.01
