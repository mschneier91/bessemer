# test/baselines.yaml -- the single source of truth for all stored numerical
# baselines (CLAUDE.md 1.0b). Test sources MUST read expected values from here;
# never hardcode a baseline as a magic number in test code.
#
# Populated per sub-sprint as checks come online. Sprint 1.0b introduces no
# numerics, so every section below is an empty placeholder documenting the schema.
#
# Conventions:
#   * Iteration-count baselines are recorded per preconditioner (jacobi vs amg),
#     per grad-div setting (gd0 vs gdpos), and -- because AMG counts are legitimately
#     rank-count-sensitive -- per rank count. Jacobi counts should agree across
#     np to within +/-1, so a single value with a tolerance band suffices there.
#   * Solver-health baselines are per-dt (the Sprint-1 pressure-mass Schur block
#     degrades as dt shrinks; that is expected, not a regression).

schema_version: 1

# FGMRES outer-iteration counts.
# schur_quality_2d_periodic: fully periodic [0,2pi]^2, Q3/Q2, one implicit solve
# at fixed dt with momentum block mass_coeff*M + nu*K (mass_coeff = beta0/dt for
# BDF2 at dt = 0.01). Jacobi velocity block; counts agree across np in {1,2,4}
# within `band`. `flat_band` bounds max-min across the meshes (mesh robustness).
# Grad-div (gdpos) and AMG baselines land in 1.10 / when AMG is wired.
solver_iterations:
  schur_quality_2d_periodic:
    nu: 1.0
    mass_coeff: 150.0   # beta0/dt = 1.5/0.01
    rtol: 1.0e-8
    band: 3
    flat_band: 5
    jacobi:
      # Seeded 2026-07-10 (desktop, MFEM dev 4.9.1): identical at np {1,2,4}.
      n4: 9
      n8: 8
      n16: 7
    # gamma = grad_div_scale * h per element on the velocity block; the Schur
    # block is UNCHANGED (nu * M_p^{-1} -- gamma never enters it, user decision).
    grad_div_scale: 1.0
    jacobi_gdpos:
      # Seeded 2026-07-11 (desktop, MFEM dev 4.9.1): identical at np {1,2,4}.
      # Barely above the gamma=0 counts and mesh-flat -- empirical confirmation
      # that leaving gamma out of the Schur block costs nothing.
      n4: 10
      n8: 10
      n16: 10

  # LOR-BoomerAMG velocity block (H5), VISCOUS-DOMINATED steady Stokes on the
  # unit box (homogeneous velocity Dirichlet, mass_coeff = 0, Q3/Q2). This is
  # the regime AMG is for: BoomerAMG runs on a low-order-refined (Q1-on-GLL-
  # nodes) rediscretization that is spectrally equivalent to the high-order
  # momentum block, so the iteration count is ~mesh-INDEPENDENT while Jacobi
  # grows ~quadratically (63 -> 160 -> 594 at n = 4,8,16). AMG counts are
  # rank-sensitive -> per-np. Seeded 2026-07-15 (desktop, MFEM dev).
  lor_amg_viscous_dirichlet:
    rtol: 1.0e-8
    band: 4                 # per-entry tolerance on the LOR-AMG count
    mesh_robust_band: 25    # max-min across n must stay under this (LOR: ~16)
    jacobi_finest_ratio: 3  # jacobi[n16] must exceed this * lor_amg[n16]
    np1: { n4: 53, n8: 62, n16: 69 }
    np2: { n4: 56, n8: 62, n16: 69 }
    np4: { n4: 57, n8: 63, n16: 69 }

  # Cahouet-Chabard robustness caps (CC.8 / SPEC T3+T5). Property caps, not
  # exact per-np counts: the inner CG + AMG make CC counts mildly np-sensitive,
  # so we pin the PROPERTIES (bounded, flat, mass-degrades, legacy-degrades).
  # Placeholder zeros -- seeded from measurement below.
  # Seeded 2026-07-17 (desktop). Measured: sigma sweep {0,10,1e3,1e5} cc
  # 19-32 flat, mass (same LOR-AMG velocity block) 45-104 with the degradation
  # at sigma=1e5 (104 vs 32 -- the Delta-t limitation CC removes); nu sweep
  # {1..1e-6} cc 20-34; T5 (outflow domain, rtol 1e-10) consistent 54/52/49 vs
  # legacy 57/57/55 at n=8/16/32 -- gap grows under refinement. Counts np-stable
  # to +-2 at np {1,2,4}.
  cc_robustness:
    sigma_sweep_cc_cap: 45
    sigma_mass_degradation_ratio: 2.0
    nu_sweep_cc_cap: 45
    t5_consistent_cap: 65
    t5_legacy_min_ratio: 1.04
    # Cap for the full slow-tier (nu, sigma, h, p) grid. Measured 2026-07-17:
    # worst 63 (2D grid: nu {1..1e-6} x sigma {0..1e6} x n {4,8,16} x Q2..Q5)
    # and 59 (3D subset) -- bounded over the whole grid, ~17 s wall at np=4.
    slow_sweep_cc_cap: 85

# Convergence-oracle rates (filled in 1.5/1.8). Targets derive from the configured
# (k_u, k_p) pair; defaults are Q3/Q2 => velocity order 4, pressure order 3.
#   tgv2d:
#     spatial:  { velocity_order: <rate>, pressure_order: <rate>, slack: 0.2 }
#     temporal: { bdf2: 2.0, bdf3: 3.0, slack: 0.2 }
convergence_rates: {}

# Divergence norms (filled in 1.10). ||div u|| ceilings, gamma=0 vs gamma>0.
divergence: {}
