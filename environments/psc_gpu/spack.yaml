# environments/psc_gpu/spack.yaml -- PSC Bridges-2 H100 nodes: the stack with
# CUDA (cuda_arch=90). The compiler is the GPU nodes' build of GCC (b2gpu), so
# the compiler and most of what it built run on the GPU nodes and crash on the
# login nodes ("Illegal instruction"). Procedure: docs/install/bridges2.md.
spack:
  specs:
    # MUMPS (human 2026-10-09): MFEM's +mumps (MFEM_USE_MUMPS; pulls MUMPS and
    # ScaLAPACK). No OpenMP in MUMPS: one MPI rank per core here, and OpenMP
    # threads per rank would oversubscribe. METIS/ParMETIS orderings.
    # MFEM v4.10 (2026-09-01) with mfem/mfem#5464 as a local patch (human
    # 2026-10-15): v4.10 contains PR #5297, whose ParMesh::AnisotropicConflict
    # segfaults on nonconforming 3D hex meshes at np >= 2 (mfem/mfem#5602);
    # #5464 (unmerged) fixes it. Built from the source tree in the develop
    # section below. Drop the patch once #5464 is in a release.
    - mfem@develop
      +cuda cuda_arch=90 +gslib+lapack+libceed+mpi+mumps+shared+suite-sparse
      ^gslib@1.0.9 cflags="-fPIC"
      ^mumps+metis+parmetis~openmp
      ^hypre+cuda cuda_arch=90 ldflags="-ldl"
      ^libceed+cuda cuda_arch=90
      ^suite-sparse~cuda

    - cmake
    - ninja
    - openmpi+cuda fabrics=ucx schedulers=slurm
      ^ucx+cuda~gdrcopy+verbs+rc+ud+dc+mlx5_dv cuda_arch=90

    - googletest
    - astyle
    - yaml-cpp

    # Python interface: our own pybind11 bindings over the incns Case surface
    # (PyMFEM is never used). numba provides the @cfunc fast path for
    # user-defined ICs/BCs/forcing -- a raw C function pointer the bindings wrap
    # as an mfem::Coefficient, avoiding per-quad-point Python-callback overhead.
    # No mpi4py: Python is a pure SPMD driver; MPI lives below the binding line.
    # numba lags Python releases, so the interpreter is pinned to a
    # numba-supported version, and numba likewise constrains the numpy version.
    - python@3.12
    - py-pybind11
    - py-numpy
    #- py-numba
    # pip installs the numba wheel (docs/install/bridges2.md, Step 4); the
    # environment's Python has none otherwise.
    - py-pip

  # The MFEM source: a clone at tag v4.10 with #5464's own diff (vs its last
  # master merge, 3001edfcf4) committed on a local branch v4.10-pr5464. Spack
  # builds it as a develop package (the compute nodes have no internet).
  develop:
    mfem:
      spec: mfem@develop
      path: $PROJECT/mfem-src/mfem-4.10

  packages:
    all:
      require:
      - target=x86_64_v3
      providers:
        mpi: [openmpi]
    # Spack v1.x: compilers are dependencies. Do NOT put "%gcc" under
    # all:require (breaks externals like slurm). Use language virtuals:
    c:
      require:
      - gcc@13.3.1
    cxx:
      require:
      - gcc@13.3.1
    fortran:
      require:
      - gcc@13.3.1
    gcc:
      externals:
      - spec: gcc@13.3.1 languages:='c,c++,fortran'
        prefix: /opt/packages/gcc/v13.3.1-p20240614/b2gpu
        modules:
        - gcc/13.3.1-p20240614
        extra_attributes:
          compilers:
            c: /opt/packages/gcc/v13.3.1-p20240614/b2gpu/bin/gcc
            cxx: /opt/packages/gcc/v13.3.1-p20240614/b2gpu/bin/g++
            fortran: /opt/packages/gcc/v13.3.1-p20240614/b2gpu/bin/gfortran
          environment:
            prepend_path:
              LD_LIBRARY_PATH: /opt/packages/gcc/v13.3.1-p20240614/b2gpu/lib64
      buildable: false
    cuda:
      buildable: false
      externals:
      - spec: cuda@12.6.1
        prefix: /opt/packages/cuda/v12.6.1
    slurm:
      buildable: false
      externals:
      - spec: slurm@22.05.11
        prefix: /usr

  concretizer:
    unify: when_possible
    reuse: true

  view: true