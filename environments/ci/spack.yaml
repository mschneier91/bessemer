# environments/ci/spack.yaml -- the continuous-integration environment
# (.github/workflows/ci.yml), CPU only. Generated by
#   scripts/setup.sh --env-only --name ci --compiler /usr
# in an ubuntu:24.04 container (gcc, g++, gfortran 13.3 from apt), then trimmed:
# no Python stack (python, pybind11, numpy, numba, matplotlib), which the `cpu`
# preset never uses and which would double the cold install. astyle is pinned
# to the version scripts/style.sh requires. Spack itself is pinned in the
# workflow (SPACK_REF), so a resolve here and in CI agree.
spack:
  specs:
    # MUMPS (human 2026-10-09): MFEM's +mumps (MFEM_USE_MUMPS; pulls MUMPS and
    # ScaLAPACK). No OpenMP in MUMPS: one MPI rank per core, and OpenMP threads
    # per rank would oversubscribe. METIS/ParMETIS orderings.
    # MFEM pinned (human 2026-10-09) to master just before PR #5297 ("General
    # NC mesh spacing in parallel", https://github.com/mfem/mfem/pull/5297):
    # its ParMesh::AnisotropicConflict segfaults on nonconforming 3D hex meshes
    # at np >= 2 (reported upstream 2026-10-09). Drop the pin once fixed.
    - mfem@develop commit=1c19aba72a2b91ee918a332e668cf00922848321
      +gslib+lapack+libceed+mpi+mumps+shared+static+suite-sparse
      ^gslib@1.0.9 cflags="-fPIC"
      ^mumps+metis+parmetis~openmp

    - cmake
    - ninja
    - openmpi

    - googletest
    - astyle@3.4.11
    - yaml-cpp

  concretizer:
    unify: true

  view: true

  packages:
    all:
      providers:
        mpi: [openmpi]
      # A generic target, so one resolve serves every CI runner's CPU.
      require:
      - target=x86_64_v3
    # --- machine settings (scripts/setup.sh) ---------------------------------
    # The compiler. Spack 1.x treats compilers as dependencies: requiring the
    # c/cxx/fortran virtuals pins every package to this GCC (a %gcc under
    # all:require would break externals). Declared external, so the requirement
    # doesn't apply to building the compiler itself.
    c:
      require:
      - gcc@13.3.0
    cxx:
      require:
      - gcc@13.3.0
    fortran:
      require:
      - gcc@13.3.0
    gcc:
      buildable: false
      externals:
      - spec: gcc@13.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
