# FDA benchmark nozzle, throat Re 500, Q3/Q2 (about 5.0M velocity DOFs on the
# level-0 mesh) to t = 1000: how long the flow takes to become steady, and the
# coarse member of the p-ladder against fda_nozzle_re500.yaml (Q6/Q5). One GPU.
# The run starts from rest, and the inlet pipe's profile develops on its viscous
# time: the slowest mode decays as exp(-t / 195) (R^2 / (nu j0^2), R = 1.5), so
# the inlet pipe needs t ~ 900 to settle to 1 %; the throat (time 22) and the
# jet settle much sooner. Statistics average t >= 900.
#
#   build/cuda/apps/run_case benchmarks/fda_nozzle/fda_nozzle_re500_q3.yaml
# Geometry (benchmarks/fda_nozzle/fda_nozzle_mesh.py; lengths in throat
# diameters, d = 1): inlet pipe D = 3 (12 long, from z = -27.67), a 20-degree
# cone to the throat d = 1 (10 long), the sudden expansion at z = 0, outlet
# pipe D to z = 30. Flow in +z. Throat Reynolds number Re = U_th d / nu with
# U_th = 1 the throat's mean velocity, so nu = 1 / Re and the inlet's mean
# velocity is (d / D)^2 = 1/9. Inflow: Poiseuille in the inlet pipe (profile:
# pipe), ramped up over the first 2 time units; walls no-slip; outlet
# do-nothing (directional, the default).

equation: navier_stokes

physics:
  nu: 0.002        # Re = 500 at the throat

discretization:
  order_u: 3
  order_p: 2

mesh:
  dim: 3
  geometry: file
  file: runs/fda_nozzle/fda_nozzle_l0.msh   # 56,320 hexes, geometry order 3

time:
  dt: 0.001          # the first step; then CFL control
  t_final: 1000

boundary_conditions:
  - {select: [inlet], type: velocity, profile: pipe, u_mean: 0.1111111111111111,
     radius: 1.5, center: [0, 0, 0], axis: [0, 0, 1],
     time_profile: ramp, time_scale: 2.0}
  - {select: [walls], type: no_slip}
  - {select: [outlet], type: outflow}

flow_statistics:
  # Time averages for the comparison with the FDA PIV data. Stations are in
  # throat diameters from the sudden expansion (FDA's axial locations, -0.088
  # to 0.080 m with d = 4 mm; check them against the data release before
  # comparing; 0.01 and 15.01 sit just off element faces, where some
  # points are missed). Upstream of the cone and downstream of the step the pipe radius
  # is 1.5, in the throat 0.5.
  enabled: true
  start_time: 900.0
  interval: 1
  fields: false
  lines:
    - {name: centerline, from: [0, 0, -27.67], to: [0, 0, 30], points: 1155}
  profiles:
    # FDA's twelve profile stations: z = -22, -16, -12, -5, -2, 0, 2, 4, 6, 8, 15, 20
    # (checked against its Re 500 data, SE_exp_0500.zip). z = -12 is in the cone,
    # where the wall is at r = 0.8527; z = 10 and 12 below are extra (FDA has the
    # centreline there, no profile).
    - {name: inlet, origin: [0, 0, 0], axis: [0, 0, 1], stations: [-22, -16],
       radius: 1.5, points: 31, azimuths: 16}
    - {name: cone, origin: [0, 0, 0], axis: [0, 0, 1], stations: [-12],
       radius: 0.85, points: 35, azimuths: 16}
    - {name: throat, origin: [0, 0, 0], axis: [0, 0, 1], stations: [-5, -2],
       radius: 0.5, points: 21, azimuths: 16}
    - {name: outlet, origin: [0, 0, 0], axis: [0, 0, 1],
       stations: [0.01, 2, 4, 6, 8, 10, 12, 15.01, 20], radius: 1.5, points: 61,
       azimuths: 16}
  walls:
    # Bin widths about the axial cell sizes (an empty bin is NaN): 0.49
    # upstream, 0.25 in the jet region, 1 in the coarse far outlet.
    - {name: wall_upstream, boundaries: [walls], origin: [0, 0, 0],
       axis: [0, 0, 1], from: -27.67, to: 0, bins: 56}
    - {name: wall_jet, boundaries: [walls], origin: [0, 0, 0], axis: [0, 0, 1],
       from: 0, to: 15, bins: 60}
    - {name: wall_far, boundaries: [walls], origin: [0, 0, 0], axis: [0, 0, 1],
       from: 15, to: 30, bins: 15}

checkpoint:
  enabled: true
  path: runs/fda_nozzle/re500_q3/chk
  interval: 500

output:
  path: runs/fda_nozzle/re500_q3
  name: re500_q3
  progress: 1.0
  history: true
  diagnostics: true
  interval: 20
