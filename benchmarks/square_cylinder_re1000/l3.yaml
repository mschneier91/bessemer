# Flow past a square cylinder at Re = 1000, zero incidence: convergence level l3.
# Joly, Etienne & Pelletier, J. Fluids Struct. 28 (2012) 232-243, Fig. 3 domain: inlet 60 D
# upstream of the centre, outlet 120 D downstream, sides 60 D away; free stream on the
# inlet and sides, do-nothing outflow, no-slip square; U = D = 1.
#
# This level: AMR indicator tolerance 0.0625, min_size 0.025, max_elements 250000
# (a fuse). The ladder halves tolerance and min_size per level: l05, l1, l2, l3. Every
# other key is identical between levels, so the statistics can be compared.
# OIFS CFL 2 (BDF3, collocated mass), AMR in simulated time on a coarse base mesh until
# t = 60, then a fixed mesh; t_final 130 = 30 spin-up + 100 averaging. A bump behind the
# square seeds the shedding.
#
# Expected here: 100-150 k elements, days at 4 ranks (HPC or a large desktop; the cap is a fuse for the memory you have).
# Run from a scratch directory (runs/); more than 4 ranks needs the human's approval.
#
#   mpirun -np 4 build/cpu/apps/run_case benchmarks/square_cylinder_re1000/l3.yaml
#   python3 benchmarks/square_cylinder_re1000/analyze.py sqcyl_re1000_l3/sqcyl_re1000_l3_history.csv
#
# The deck's own summary has no `reference` block (the published values are for Re 200).
# `forces.statistics` must stay on: it also switches on the per-step force evaluation, and
# with it off the history's C_D and C_L are nan. At Re 1000 the shedding is broadband, so the
# summary's forces.periodic block (the period finder) is meaningless: ignore it, and use the
# per-step history with analyze.py.

equation: navier_stokes

physics:
  Re: 1000

discretization:
  order_u: 3
  order_p: 2

mesh:
  dim: 2
  geometry: square_cylinder
  square_cylinder:          # a coarse base mesh (1,172 cells); AMR does the refinement
    n_face: 2
    corner_ratio: 1.0
    far_ratio: 1.5
    wake_ratio: 1.3
    wake_h: 1.0
    wake_end: 25.0

initial_velocity: uniform
initial:
  velocity: [1, 0]
  perturbation: 0.1         # Gaussian bump behind the square: shedding starts early
  perturbation_center: [2, 0]

time:
  dt: 0.01                  # the first step; then dt = cfl_target / CFL rate
  t_final: 130              # 30 spin-up + 100 averaging; extend from the checkpoint if the error bar needs it
  step_control: cfl
  cfl_target: 2.0
  convection: oifs

solver:
  rtol: 1.0e-8

boundary_conditions:
  - {select: [inflow, sides], type: velocity, value: [1, 0]}
  - {select: [outflow], type: outflow}
  - {select: [body], type: no_slip}

amr:
  enabled: true
  every_time: 1.0           # an event every time unit ...
  end_time: 60              # ... until t = 60; the mesh is then fixed for the averaging window
  threshold_mode: absolute
  tolerance: 0.0625
  min_size: 0.025
  max_elements: 250000   # a fuse, not the criterion: the final element count must be below it
  anisotropic: true

forces:
  enabled: true
  boundaries: [body]
  reference_velocity: 1.0
  reference_area: 1.0       # D (a length in 2D)
  interval: 0               # no CSV log; the history and summary carry them
  statistics: true          # REQUIRED for the per-step C_D, C_L in the history (false gives nan);
  average_periods: 10       # the summary's forces.periodic block is meaningless at Re 1000: ignore it

output:
  path: sqcyl_re1000_l3
  name: sqcyl_re1000_l3
  progress: 5               # a progress line every 5 time units
  history: true

checkpoint:                 # rolling; restart with the same np to extend the run
  enabled: true
  path: chk_l3
  interval: 1000
