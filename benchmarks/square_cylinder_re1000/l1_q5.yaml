# Flow past a square cylinder at Re = 1000: the element-order experiment (human
# 2026-10-12: "the Q5 results will be interesting"). l1.yaml with Q5/Q4 elements instead
# of Q3/Q2; every other key equal, the AMR settings included.
#
# Why l1's AMR: the indicator is the velocity change across an element, which does not
# depend on the order, so at the same tolerance Q5 gets about l1's mesh (12-18 k
# elements) with (5/3)^2 = 2.8x the unknowns per element: about l2's unknown count (Q3,
# 35-50 k elements). The comparisons:
#   l1_q5 vs l2 (Q3, about the same unknowns): is higher order more accurate per unknown?
#   l1_q5 vs l1 (Q3, the same mesh): how much does the order alone change?
# and the cost of each (wall time, steps: Q5's GLL spacing makes dt about 0.4x l1's).
#
# Expected (extrapolated, not measured): 12-18 k elements; about l2's unknowns and steps,
# at a higher cost per unknown (the sum-factorized kernels grow with the order), so ~2-3
# days at 4 ranks on the desktop.
#
#   mpirun -np 4 build/cpu/apps/run_case benchmarks/square_cylinder_re1000/l1_q5.yaml
#   python3 benchmarks/square_cylinder_re1000/analyze.py \
#       l1=sqcyl_re1000_l1/sqcyl_re1000_l1_history.csv \
#       l1_q5=sqcyl_re1000_l1_q5/sqcyl_re1000_l1_q5_history.csv \
#       l2=sqcyl_re1000_l2/sqcyl_re1000_l2_history.csv

equation: navier_stokes

physics:
  Re: 1000

discretization:
  order_u: 5
  order_p: 4

mesh:
  dim: 2
  geometry: square_cylinder
  square_cylinder:          # a coarse base mesh (1,172 cells); AMR does the refinement
    n_face: 2
    corner_ratio: 1.0
    far_ratio: 1.5
    wake_ratio: 1.3
    wake_h: 1.0
    wake_end: 25.0

initial_velocity: uniform
initial:
  velocity: [1, 0]
  perturbation: 0.1         # Gaussian bump behind the square: shedding starts early
  perturbation_center: [2, 0]

time:
  dt: 0.01                  # the first step; then dt = cfl_target / CFL rate
  t_final: 130              # 30 spin-up + 100 averaging; extend from the checkpoint if the error bar needs it
  step_control: cfl
  cfl_target: 2.0
  convection: oifs

solver:
  rtol: 1.0e-8

boundary_conditions:
  - {select: [inflow, sides], type: velocity, value: [1, 0]}
  - {select: [outflow], type: outflow}
  - {select: [body], type: no_slip}

amr:
  enabled: true
  every_time: 1.0           # an event every time unit ...
  end_time: 60              # ... until t = 60; the mesh is then fixed for the averaging window
  threshold_mode: absolute
  tolerance: 0.25
  min_size: 0.1
  max_elements: 40000   # a fuse, not the criterion: the final element count must be below it
  anisotropic: true

forces:
  enabled: true
  boundaries: [body]
  reference_velocity: 1.0
  reference_area: 1.0       # D (a length in 2D)
  interval: 0               # no CSV log; the history and summary carry them
  statistics: true          # REQUIRED for the per-step C_D, C_L in the history (false gives nan);
  average_periods: 10       # the summary's forces.periodic block is meaningless at Re 1000: ignore it

output:
  path: sqcyl_re1000_l1_q5
  name: sqcyl_re1000_l1_q5
  progress: 5               # a progress line every 5 time units
  history: true

checkpoint:                 # rolling; restart with the same np to extend the run
  enabled: true
  path: chk_l1_q5
  interval: 1000
