# Turek & Hron (2006) CFD1: the flow around a cylinder with a rigid flag
# (README.md). Channel 2.5 x 0.41, cylinder of radius 0.05 at (0.2, 0.2),
# flag 0.35 x 0.02 from the cylinder to x = 0.6; nu = 1e-3, parabolic inflow
# of mean 0.2 ramped by (1 - cos(pi t / 2)) / 2 for t < 2. Forces on the
# cylinder and the flag together: reference_area 0.002 makes the summary's
# cd / cl (and the forces CSV's Cx / Cy) Turek & Hron's forces at their
# density 1000.
#
#   mpirun -np 4 build/cpu/apps/run_case benchmarks/turek_hron/cfd1.yaml
#   -> cfd1/cfd1_summary.json (reference errors in its "reference" section)
#
# Steady (Re 20): marched to t_final by error-controlled steps, as cases/dfg_2d1.yaml.

equation: navier_stokes
physics:
  nu: 1.0e-3
discretization:
  order_u: 4
  order_p: 3
mesh:
  dim: 2
  geometry: cylinder_channel
  cylinder_channel:
    length: 2.5
    flag_length: 0.35
    flag_thickness: 0.02
    n_flag: 8
    n_flag_y: 2
    n_down: 16
time:
  dt: 0.01
  t_final: 10
  step_control: error
  atol: 1.0e-6
  rtol: 1.0e-5
  cfl_max: 0.24
boundary_conditions:
  - {select: [inflow], type: velocity, profile: parabolic, u_max: 0.3, height: 0.41,
     time_profile: ramp, time_scale: 2.0}
  - {select: [walls, cylinder, flag], type: no_slip}
  - {select: [outflow], type: outflow}
forces:
  enabled: true
  boundaries: [cylinder, flag]
  reference_velocity: 1.0
  reference_area: 0.002
  interval: 0
output:
  path: cfd1
  name: cfd1
  progress: 50
reference:
  cd: 14.2929
  cl: 1.11905
