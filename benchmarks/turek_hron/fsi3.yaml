# Turek & Hron (2006) FSI3: the elastic flag behind the cylinder in a periodic
# self-sustained oscillation (README.md). FSI3: mean inflow 2 (Re 200), flag density 1,000
# (rho_s / rho_f = 1: the strongest added mass), shear modulus 2e6 (E = 5.6e6),
# Poisson's ratio 0.4; fluid nu = 1e-3, density 1000. The solid is St.
# Venant-Kirchhoff (fsi.solid hyperelasticity), dynamic, plane strain, coupled
# in every step by Dirichlet-Neumann subiterations with IQN-ILS (docs/fsi.md),
# the solid stepped by BDF2 like the fluid.
# The inflow ramps over 2 time units; the oscillation then grows from
# roundoff, so the run is long. Turek & Hron's values are over the last
# period, mean +- amplitude from the extremes:
#
#   mpirun -np 4 build/cpu/apps/run_case benchmarks/turek_hron/fsi3.yaml
#   python3 benchmarks/turek_hron/fsi.py fsi3 fsi3/fsi3_forces.csv fsi3/fsi3_fsi.csv

equation: navier_stokes
physics:
  nu: 1.0e-3
discretization:
  order_u: 4
  order_p: 3
mesh:
  dim: 2
  geometry: cylinder_channel
  cylinder_channel:
    length: 2.5
    flag_length: 0.35
    flag_thickness: 0.02
    n_flag: 8
    n_flag_y: 2
    n_down: 16
time:
  dt: 0.00025
  t_final: 10
  step_control: fixed
  convection: imex
boundary_conditions:
  - {select: [inflow], type: velocity, profile: parabolic, u_max: 3.0, height: 0.41,
     time_profile: ramp, time_scale: 2.0}
  - {select: [walls, cylinder], type: no_slip}
  - {select: [flag], type: interface}
  - {select: [outflow], type: outflow}
mesh_motion:
  stiffening: 1
solid:
  newton_atol: 1.0e-9    # the SVK residual's roundoff floor at tiny loads
  model: st_venant_kirchhoff
  youngs_modulus: 5.6e6
  poisson_ratio: 0.4
  plane: strain
  density: 1000
  analysis: dynamic
  time_scheme: bdf      # BDF2, the fluid's scheme: undamped generalized-alpha
                        # (rho_inf 1) left a step-to-step force ripple
  probe: [0.6, 0.2]
fsi:
  enabled: true
  solid: hyperelasticity
  solid_fixed: [cylinder]
  fluid_density: 1000
  acceleration: iqn_ils
  reuse: 2
  rtol: 1.0e-6          # 1e-4 leaves a coupling error that the added mass
                        # turns into a force ripple 100x larger (docs/fsi.md)
solver:
  rtol: 1.0e-9          # well below fsi.rtol, or the subiterations stall
forces:
  enabled: true
  boundaries: [cylinder, flag]
  reference_velocity: 1.0
  reference_area: 0.002
  interval: 1
output:
  path: fsi3
  name: fsi3
  progress: 0.5
