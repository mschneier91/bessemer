# Taylor-Green vortex, Re = 1600 (International Workshop on High-Order CFD
# Methods, case C3.5): u = (sin x cos y cos z, -cos x sin y cos z, 0) on a
# 2 pi periodic box (V0 = L = 1), nu = 1 / 1600, t in [0, 20]. Transition to
# turbulence; the dissipation rate peaks near t = 9 (spectral DNS on 512^3:
# eps_max = 0.01286 at t = 8.97, benchmarks/tgv_re1600/reference).
#
# Resolution: 32^3 Q3/Q2 elements (96 velocity nodes per direction).
# 4 MPI ranks on a desktop (within the default limits; long: hours).
# IMEX convection (human 2026-10-12: IMEX, not OIFS, for this case) at
# CFL 0.25 (human 2026-10-13). NOT 0.5: at this Reynolds number BDF2 with
# explicit convection is unstable there -- the kinetic energy RISES from
# t ~ 1.3 at 32^3 and t ~ 0.7 at 64^3, and the run carries on, noisy, without
# aborting. At 0.25 the energy never increases (README, "Time step").
#
#   mpirun -np 4 build/cpu/apps/run_case benchmarks/tgv_re1600/tgv_re1600_n32.yaml
#   python3 benchmarks/tgv_re1600/plot.py tgv_n32/tgv_diagnostics.csv

equation: navier_stokes

physics:
  nu: 6.25e-4

discretization:
  order_u: 3
  order_p: 2

mesh:
  dim: 3
  elements: [32, 32, 32]
  lengths: [6.283185307179586, 6.283185307179586, 6.283185307179586]
  periodic: [true, true, true]

initial_velocity: taylor_green_3d

time:
  dt: 0.005                    # the first step; CFL control after it
  t_final: 20
  step_control: cfl
  cfl_target: 0.25
  convection: imex

output:
  path: tgv_n32
  name: tgv
  diagnostics: true            # E(t) and eps(t) for plot.py, every step
  interval: 1
  progress: 0.5
  history: true

checkpoint:
  enabled: true
  path: tgv_n32/chk
  # Every 1000 steps: a checkpoint holds the solvers' guess state too (up to
  # 17 system-sized vectors more), ~1.7 s at 64^3 (job 49276194).
  interval: 1000

solver:
  # The fast configuration (docs/throughput.md, 2026-10-15): the initial guess
  # projected onto the last 8 solutions, two inner Schur iterations, and rtol
  # as a fraction of what a step changes (the step reference). 1e-3 keeps this
  # flow's checks (TGV 32^3 dissipation within 1.7e-4 of the reference peak;
  # channel Re_tau 180 statistics over t = 60 to 120 within the sampling
  # noise) and is the fastest measured; instantaneous forces (DFG) want 1e-6.
  # A restart from a checkpoint matches an uninterrupted run to the solver
  # tolerance, not bitwise: the projection's solutions are not checkpointed.
  tolerance_reference: step
  initial_guess: project
  projection_k: 8
  n_inner: 2
  rtol: 1.0e-3
