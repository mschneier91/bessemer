# Flow past a square cylinder at Re = 10 000, zero incidence, in 2D: level l2eq.
# 2D on purpose (human): a numerical study of resolved 2D flow, not a model of the
# (3D) physical flow. Plan and costs: docs/design/re10000_plan.md; protocol:
# benchmarks/square_cylinder_re10000/README.md.
#
# Every key equals benchmarks/square_cylinder_re1000/l2.yaml except Re and this level's
# AMR: the indicator tolerance stays the Re 1000 level's (0.125: the indicator is the
# velocity change across an element, so a fixed tolerance already refines steeper
# gradients); min_size, the floor, is the Re 1000 level's x 1/sqrt(10) = 0.016, so it
# does not stop that refinement early. max_elements 800000 is a fuse: the final element
# count must be below it, or the level was cost-limited.
#
# Expected (extrapolated from Re 1000 L2, not measured): ~470 k elements, ~10 M unknowns, dt ~0.004,
# ~32 k steps to t = 130, ~6 k core-hours at perfect scaling, ~8-11 k at 60%: over the
# 5 k core-hour allocation (2026-10-12). Do not submit before the probes measure the
# cost and the allocation covers it.
# Valid as "the converged level" only if Re 1000 converges at L2 (gate A).
#
# On Bridges-2 (RM, CPU only): benchmarks/square_cylinder_re10000/jobs/production.sbatch.
# Every job needs the human's yes with resources and cost (AGENTS.md rule 3).

equation: navier_stokes

physics:
  Re: 10000

discretization:
  order_u: 3
  order_p: 2

mesh:
  dim: 2
  geometry: square_cylinder
  square_cylinder:          # a coarse base mesh (1,172 cells); AMR does the refinement
    n_face: 2
    corner_ratio: 1.0
    far_ratio: 1.5
    wake_ratio: 1.3
    wake_h: 1.0
    wake_end: 25.0

initial_velocity: uniform
initial:
  velocity: [1, 0]
  perturbation: 0.1         # Gaussian bump behind the square: shedding starts early
  perturbation_center: [2, 0]

time:
  dt: 0.01                  # the first step; then dt = cfl_target / CFL rate
  t_final: 130              # 30 spin-up + 100 averaging; extend from the checkpoint if the error bar needs it
  step_control: cfl
  cfl_target: 2.0
  convection: oifs

solver:
  rtol: 1.0e-8

boundary_conditions:
  - {select: [inflow, sides], type: velocity, value: [1, 0]}
  - {select: [outflow], type: outflow}
  - {select: [body], type: no_slip}

amr:
  enabled: true
  every_time: 1.0           # an event every time unit ...
  end_time: 60              # ... until t = 60; the mesh is then fixed for the averaging window
  threshold_mode: absolute
  tolerance: 0.125
  min_size: 0.016
  max_elements: 800000   # a fuse, not the criterion: the final element count must be below it
  anisotropic: true

forces:
  enabled: true
  boundaries: [body]
  reference_velocity: 1.0
  reference_area: 1.0       # D (a length in 2D)
  interval: 0               # no CSV log; the history and summary carry them
  statistics: true          # REQUIRED for the per-step C_D, C_L in the history (false gives nan);
  average_periods: 10       # the summary's forces.periodic block is meaningless at Re 1000: ignore it

output:
  path: sqcyl_re10000_l2eq
  name: sqcyl_re10000_l2eq
  progress: 5               # a progress line every 5 time units
  history: true

checkpoint:                 # rolling; restart with the same np to extend the run
  enabled: true
  path: chk_re10000_l2eq
  interval: 1000
