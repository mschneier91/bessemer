# Fluid-structure interaction in a few seconds: the Turek-Hron flag
# (benchmarks/turek_hron) at Q2/Q1 on the coarse mesh, the FSI1 solid
# (density 1000, Poisson's ratio 0.4, E = 1.4e6) marched dynamically, an
# inflow ramped up over t = 0.1, ten coupled steps with IQN-ILS
# (docs/fsi.md). A smoke deck: a ctest runs it at np 1/2/4. For the
# benchmark itself see benchmarks/turek_hron/fsi1.yaml.
#
#   mpirun -np 4 build/cpu/apps/run_case cases/fsi_flag.yaml
#   -> fsi_flag/fsi_flag_summary.json (section fsi: subiterations, the tip's
#      displacement), fsi_flag/fsi_flag_fsi.csv (per step)

equation: navier_stokes
physics:
  nu: 1.0e-3
discretization:
  order_u: 2
  order_p: 1
mesh:
  dim: 2
  geometry: cylinder_channel
  cylinder_channel:
    length: 2.5
    flag_length: 0.35
    flag_thickness: 0.02
    n_flag: 8
    n_flag_y: 2
    n_down: 16
time:
  dt: 0.005
  t_final: 0.05
  step_control: fixed
  convection: imex
solver:
  rtol: 1.0e-9   # well below fsi.rtol: the coupling cannot converge below
                 # the flow solve's own error
boundary_conditions:
  - {select: [inflow], type: velocity, profile: parabolic, u_max: 0.3, height: 0.41,
     time_profile: ramp, time_scale: 0.1}
  - {select: [walls, cylinder], type: no_slip}
  - {select: [flag], type: interface}
  - {select: [outflow], type: outflow}
solid:
  analysis: dynamic
  youngs_modulus: 1.4e6
  poisson_ratio: 0.4
  density: 1000
  probe: [0.6, 0.2]
fsi:
  enabled: true
  solid_fixed: [cylinder]
  fluid_density: 1000
  acceleration: iqn_ils
  rtol: 1.0e-6
forces:
  enabled: true
  boundaries: [cylinder, flag]
  reference_velocity: 1.0
  reference_area: 0.002
  interval: 0
output:
  path: fsi_flag
  name: fsi_flag
  progress: 0
