# Turek & Hron (2006) CSM1: the flag on its own, clamped to the cylinder, under
# gravity g = 2 on rho_s = 1000 (the body force rho_s g per reference volume),
# St. Venant-Kirchhoff with mu_s = 0.5e6 and nu_s = 0.4 (E = 1.4e6), plane
# strain, static. Point A = (0.6, 0.2), the midpoint of the free end; the
# benchmark's reference (FeatFlow, level 4+2, 164092 dofs) is
# u(A) = (-7.18766e-3, -66.1023e-3). The linear model on the same data:
# cases/turek_hron_flag_linear.yaml. The mesh is the cylinder_channel flag's
# solid part, whose interface nodes are the fluid mesh's.
#
#   mpirun -np 4 build/cpu/apps/run_case cases/turek_hron_csm1.yaml

equation: hyperelasticity
mesh:
  dim: 2
  geometry: cylinder_channel
  cylinder_channel:
    length: 2.5
    flag_length: 0.35
    flag_thickness: 0.02
    n_flag: 16
    n_flag_y: 2
    part: solid
solid:
  model: st_venant_kirchhoff
  youngs_modulus: 1.4e6
  poisson_ratio: 0.4
  plane: strain
  order: 4
  body_force: [0.0, -2000.0]
  probe: [0.6, 0.2]
boundary_conditions:
  - {select: [cylinder], type: fixed}
  - {select: [flag], type: free}
output:
  path: turek_hron_csm1
  name: turek_hron_csm1
