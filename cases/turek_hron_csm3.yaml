# Turek & Hron (2006) CSM3: the CSM1 flag (mu_s = 0.5e6, nu_s = 0.4, so E =
# 1.4e6; rho_s = 1000) released from rest at t = 0 under gravity g = 2, plane
# strain, dynamic. Point A = (0.6, 0.2) oscillates; the benchmark's reference
# (FeatFlow, "CSM tests", level 4+0, dt 0.005): u_x(A) = -14.305 +- 14.305,
# u_y(A) = -63.607 +- 65.160 (e-3), frequency 1.0995, as mean +- amplitude
# from the extremes. output.history writes u(A) per step to
# turek_hron_csm3/turek_hron_csm3_history.csv.
#
#   mpirun -np 4 build/cpu/apps/run_case cases/turek_hron_csm3.yaml

equation: hyperelasticity
mesh:
  dim: 2
  geometry: cylinder_channel
  cylinder_channel:
    length: 2.5
    flag_length: 0.35
    flag_thickness: 0.02
    n_flag: 16
    n_flag_y: 2
    part: solid
solid:
  model: st_venant_kirchhoff
  youngs_modulus: 1.4e6
  poisson_ratio: 0.4
  plane: strain
  order: 4
  body_force: [0.0, -2000.0]
  probe: [0.6, 0.2]
  analysis: dynamic
  density: 1000.0
  time_scheme: generalized_alpha
  rho_inf: 1.0
time:
  dt: 0.005
  t_final: 10.0
boundary_conditions:
  - {select: [cylinder], type: fixed}
  - {select: [flag], type: free}
output:
  path: turek_hron_csm3
  name: turek_hron_csm3
  history: true
