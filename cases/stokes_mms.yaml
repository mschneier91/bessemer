# Stokes transient manufactured solution -- ALL configuration lives here; only
# the analytic field functions stay in Python (run via
# examples/python/stokes_ex/run_yaml.py). The boundary-condition topology is
# declared here as named groups (selection by face name, attribute number, or
# `all`); the driver binds a velocity field to each Dirichlet group by name.

equation: stokes
device: cpu        # MFEM backend (cpu/cuda/...); default cpu

physics:
  nu: 0.7

discretization:
  order_u: 3
  order_p: 2

mesh:
  dim: 2
  elements: [3, 3]
  lengths: [1.0, 1.0]
  periodic: [false, false]

time:
  dt: 0.02
  t_final: 0.1

solver:
  rtol: 1.0e-12
  max_iter: 5000
  kdim: 400

boundary_conditions:
  - {group: exact, select: all, type: velocity_dirichlet}
